title: Scheduled task created as SYSTEM via schtasks
id: 3f8b2d10-6a97-4e0c-b1d5-9c4a7e2f6b38
status: test
description: Detects schtasks.exe creating a task that runs as SYSTEM, by name or by SID
author: detection-team
date: 2026-10-30
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_task:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
      - '/create'
      - '/ru'
  selection_user:
    CommandLine|contains:
      - 'SYSTEM'
      - 'S-1-5-18'
  condition: selection_task and selection_user
falsepositives:
  - Software installers
level: medium
vitrix:
  target: kql  # example: this rule ships as KQL; the others use default_target
