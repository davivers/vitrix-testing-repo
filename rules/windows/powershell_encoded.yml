title: PowerShell with an encoded command
id: 7c1e9a52-0d4b-4c7e-9f3a-2b6d8e41a0c5
status: stable
description: Detects powershell.exe started with the -EncodedCommand argument
author: detection-team
date: 2026-10-28
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
  filter_sccm:
    # the SCCM/MECM agent runs encoded scripts by design
    ParentImage|endswith: '\CcmExec.exe'
  condition: selection and not filter_sccm
falsepositives:
  - Legitimate administrative scripts
  - SCCM/MECM agent (excluded by filter_sccm)
level: high
