schema_version: 1

# Where the Sigma rules, the test cases, the replay datasets and the compiled output live.
rules_dir: rules
cases_dir: cases
datasets_dir: datasets
output_dir: dist

# Active SIEMs. `vitrix targets` lists the available ones (built-in and plugins).
targets:
  - splunk
  - kql
  - elastic-eql

# Final query language of each rule, from the most specific to the most general:
#   1. `vitrix: {target: kql}` inside the rule itself (string or list)
#   2. the first route below whose `match` matches the path inside rules/
#   3. `default_target`
#   4. otherwise the rule is converted to every active target
default_target: splunk
routes: []
#  - match: "azure/*"
#    target: kql

# pySigma pipelines with the field mapping of YOUR environment.
# Applied before each SIEM's default mapping.
# extra_pipelines:
#   - pipelines/my-environment.yml

# Every rule needs a cases file with at least one positive and one negative case.
require_cases: true

# What a rule needs to be publishable (defaults shown).
quality_gate:
  min_positive: 1
  min_negative: 1
  false_positive_levels: [high, critical]   # these levels require a kind: false_positive case
  require_filter_test: true                 # a rule with filter_* needs a case proving the exclusion
  require_mitre: true
  allow_warnings: true                      # false: any lint warning blocks
  blocked_status: [deprecated, unsupported]
  require_replay: false                     # true: the rule needs an expectation in some dataset
  review_days: 180                          # recommend reviewing rules unchanged for longer (0 = off)
  min_score: 80                             # health score (0-100) a rule needs to be approved (0 = no threshold)

# GitHub: NOTHING TO SET HERE when this folder is on GitHub. Run `vitrix connect your-org/your-repo`
# once: it reads the repository from `git remote origin`, uses your `gh auth login` as the token,
# and checks the CI workflow. Vitrix validates every change in the real CI (GitHub Actions) and
# only then opens the pull request.
# Only to override what is detected (or `github: false` to turn GitHub off):
# github:
#   repo: your-org/your-detections
#   base: main
#   path: ""           # the project folder inside the repository, if not the root
#   workflow: vitrix   # the workflow in .github/workflows/vitrix.yml
# The token is NEVER read from this file: `gh auth login`, or VITRIX_GITHUB_TOKEN in the environment.

# Accounts: several people in one workspace (one workspace = this repository).
# Off by default (single local user). The first account to register becomes the owner;
# after that people can join ONLY by invitation (no open sign-up).
# GitHub sign-in needs a GitHub OAuth app: set VITRIX_GITHUB_CLIENT_ID and
# VITRIX_GITHUB_CLIENT_SECRET (callback: <public url>/api/auth/github/callback).
# auth:
#   enabled: true
#   session_days: 14
#   github_login: true
#   workspace_name: Detection workspace

# Local drafts: "Save draft" in the Editor keeps unfinished rules in .vitrix/drafts.db (never in
# rules/). Without accounts they work only for a browser on this machine with a localhost-only server.
# drafts:
#   enabled: true
